[project]
name = "revintel"
version = "0.1.0"
description = "Revenue intelligence on Microsoft Fabric: Salesforce pipeline + product usage, governed KPIs."
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
revintel = "revintel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
