[project]
name = "revintel"
version = "0.1.0"
description = "Revenue intelligence on Microsoft Fabric: Salesforce pipeline + product usage, governed KPIs."
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
kusto = ["azure-kusto-data>=5", "azure-kusto-ingest>=5"]
eventhub = ["azure-eventhub>=5.11"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "azure-identity>=1.15"]
question = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "anthropic>=0.40"]
spark = ["pyspark>=3.5", "pyarrow>=15"]
all = ["revintel[dev,kusto,eventhub,api,question,spark]"]

[project.scripts]
revintel = "revintel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "services/usage-generator", "services/kql-init", "services/kpi-api", "services/question-api", "services/transform"]
markers = ["spark: needs pyspark and a JVM (slow)"]
filterwarnings = [
    "error",
    # PySpark internals: py4j sockets and pandas deprecations raised inside pyspark
    "ignore:::pyspark",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
